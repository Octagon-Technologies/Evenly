#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
# This heap also bounds the Kotlin/Native compiler: K/N runs IN-PROCESS in the Gradle daemon, not in a
# JVM of its own, so neither `kotlin.daemon.jvmargs` nor `kotlin.native.jvmArgs` reaches it (both were
# tried and changed nothing; `ps` showed the daemon as the only JVM). At the old 4g,
# `linkReleaseFrameworkIosArm64` died with `OutOfMemoryError` in DevirtualizationAnalysis - an LTO pass
# that runs only in opt mode, i.e. only in the device Release link that an App Store archive needs.
# Every simulator/debug build stayed green throughout, which is why iOS looked shippable and was not.
#
# 6g is a deliberate compromise on a 16GB machine: 8g does not fit alongside macOS and Xcode and sends
# the box into swap thrash (the link ran 70min at 0.1% CPU and had to be killed). If this OOMs again on
# a larger codebase, prefer cutting the LTO's appetite over raising this further - see IOS_RELEASE.md.
# Do not change without re-running: ./gradlew :shared:linkReleaseFrameworkIosArm64
org.gradle.jvmargs=-Xmx6144M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true