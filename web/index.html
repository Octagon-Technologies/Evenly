<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Mobile is the product surface (spec §9). Wider viewports get a centred column, not a
         different design. `viewport-fit=cover` + the safe-area insets in app.css keep the sticky
         footer above the home indicator, which is where "I'm done" lives. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <!-- Indexable by default: this file also serves the marketing site (home, privacy, terms).
         The claim route (`/b/:token`) is bill-scoped and sensitive, so `App.svelte` adds `noindex`
         back at runtime for that route only, and only there — a bill link in a chat thread must not
         render a preview of someone's dinner. -->
    <meta name="referrer" content="no-referrer" />
    <title>Evenly — Split the bill, not the friendship.</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
